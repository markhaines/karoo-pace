name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # karoo-ext is on GitHub Packages, which needs auth even for public packages.
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs, with the tag as a comment. Dependabot
      # (.github/dependabot.yml) proposes bumps as PRs, so nothing changes under us unreviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      # Gradle cache, plus a check that gradle-wrapper.jar is a genuine Gradle release.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          validate-wrappers: true
      # The runner image ships an Android SDK with licences accepted, so no
      # android-actions/setup-android (which broke on 2026-09-20 elsewhere).
      - name: Test, lint, build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Unit tests in both variants: debug proves the band, redraw and lifecycle logic;
        # release also runs ReleaseGuardTest, so SIMULATE_BANDS can never be on there.
        # lintDebug fails on any lint error.
        run: ./gradlew testDebugUnitTest testReleaseUnitTest lintDebug assembleDebug --no-daemon
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14
